name: Motadata SDK Publish (Maven Central)

# Publishes the 7 shipping modules (release variant, GPG-signed) to the Sonatype
# Central Portal via the gradle-nexus publish-plugin (OSSRH Staging API, configured in
# the root build.gradle.kts `nexusPublishing` block).
#
# Coordinates: com.motadata:motadata-rum-android*:<version from AndroidConfig.VERSION> (1.0.1).
#
# This run UPLOADS to a staging repository and CLOSES it (validation: signatures, POM,
# sources/javadoc jars) but does NOT release it. After a green run, the deployment appears
# at https://central.sonatype.com — review it there and click "Publish" to release it
# permanently to Maven Central. Until you do, it can be safely dropped (nothing is public yet).
on:
  workflow_dispatch:

jobs:
  publish-central:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # GPG signing key — read by MavenConfig.kt (useInMemoryPgpKeys). Signing is REQUIRED
      # here (we do NOT pass -Pdd-skip-signing), because Maven Central rejects unsigned artifacts.
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
      # Central Portal user token — read by the nexusPublishing block in build.gradle.kts.
      # (The build expects CENTRAL_PUBLISHER_*; the repo secrets are named CENTRAL_*.)
      CENTRAL_PUBLISHER_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PUBLISHER_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Dispatched ref (publish the functional branch = 1.0.1)
          ref: ${{ github.ref_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Publish 7 modules to Sonatype staging, then close (validate, no release)
        run: |
          ./gradlew \
            :dd-sdk-android-core:publishReleasePublicationToSonatypeRepository \
            :dd-sdk-android-internal:publishReleasePublicationToSonatypeRepository \
            :features:dd-sdk-android-rum:publishReleasePublicationToSonatypeRepository \
            :features:dd-sdk-android-trace:publishReleasePublicationToSonatypeRepository \
            :features:dd-sdk-android-trace-api:publishReleasePublicationToSonatypeRepository \
            :features:dd-sdk-android-trace-internal:publishReleasePublicationToSonatypeRepository \
            :integrations:dd-sdk-android-okhttp:publishReleasePublicationToSonatypeRepository \
            closeSonatypeStagingRepository \
            --no-daemon --stacktrace
