name: Motadata SDK Build

# Builds the three shipping modules (core, rum, okhttp) on a GitHub-hosted
# Linux runner so nothing has to compile on a local laptop.
on:
  push:
    branches:
      - motadata-dev
      - motadata-dev-with-functional-changes
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build core + rum + okhttp (debug)
        run: |
          ./gradlew \
            :dd-sdk-android-core:assembleDebug \
            :features:dd-sdk-android-rum:assembleDebug \
            :integrations:dd-sdk-android-okhttp:assembleDebug \
            --no-daemon --stacktrace

      - name: List built AARs
        if: always()
        run: |
          echo "=== produced AAR artifacts ==="
          find . -path '*/build/outputs/aar/*.aar' -printf '%p\n' 2>/dev/null || true
