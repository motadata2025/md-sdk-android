name: Motadata SDK API Dump

# Regenerates the checked-in API surface files (api/apiSurface, api/<module>.api,
# api/compiler-meta.txt) for the 7 shipping modules from the current (rebranded)
# source, then commits the result back. Needed because the rename steps changed
# public type names (DdSession -> MdSession, DdRumContentProvider -> MdRumContentProvider,
# etc.) but the build workflow only runs assembleDebug, so it never refreshed these.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apidump:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: motadata-dev
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Regenerate API surface (7 modules)
        run: |
          ./gradlew \
            :dd-sdk-android-core:generateApiSurface \
            :dd-sdk-android-core:apiDump \
            :dd-sdk-android-core:generateCompilerMetadata \
            :dd-sdk-android-internal:generateApiSurface \
            :dd-sdk-android-internal:apiDump \
            :dd-sdk-android-internal:generateCompilerMetadata \
            :features:dd-sdk-android-rum:generateApiSurface \
            :features:dd-sdk-android-rum:apiDump \
            :features:dd-sdk-android-rum:generateCompilerMetadata \
            :features:dd-sdk-android-trace:generateApiSurface \
            :features:dd-sdk-android-trace:apiDump \
            :features:dd-sdk-android-trace:generateCompilerMetadata \
            :features:dd-sdk-android-trace-api:generateApiSurface \
            :features:dd-sdk-android-trace-api:apiDump \
            :features:dd-sdk-android-trace-api:generateCompilerMetadata \
            :features:dd-sdk-android-trace-internal:generateApiSurface \
            :features:dd-sdk-android-trace-internal:apiDump \
            :features:dd-sdk-android-trace-internal:generateCompilerMetadata \
            :integrations:dd-sdk-android-okhttp:generateApiSurface \
            :integrations:dd-sdk-android-okhttp:apiDump \
            :integrations:dd-sdk-android-okhttp:generateCompilerMetadata \
            --no-daemon --stacktrace

      - name: Show diff
        if: always()
        run: |
          echo "=== git status ==="
          git status --short
          echo "=== diff stat (api files) ==="
          git diff --stat -- '**/api/apiSurface' '**/api/*.api' '**/api/compiler-meta.txt'

      - name: Commit and push regenerated API files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '**/api/apiSurface' '**/api/*.api' '**/api/compiler-meta.txt'
          if git diff --cached --quiet; then
            echo "No API changes to commit."
          else
            git commit -m "rebrand(9/9): regenerate api surface after renames [skip ci]"
            git push origin HEAD:motadata-dev
          fi

      - name: Upload API files as artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-surface
          path: |
            **/api/apiSurface
            **/api/*.api
            **/api/compiler-meta.txt
          if-no-files-found: ignore
