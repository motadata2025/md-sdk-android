name: Motadata SDK Publish (GitHub Packages)

# Publishes the 7 shipping modules (release variant) to this repo's GitHub Packages
# Maven registry as com.motadata:motadata-rum-android*:1.0.0, so a test/customer app
# can consume them as a normal Gradle dependency. GPG signing is skipped
# (-Pdd-skip-signing) — GitHub Packages does not require signatures.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Dispatched ref (motadata-dev = 1.0.0 / Branch 1; motadata-dev-with-functional-changes = 1.0.1 / Branch 2)
          ref: ${{ github.ref_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Publish to GitHub Packages (7 modules)
        run: |
          ./gradlew \
            :dd-sdk-android-core:publishReleasePublicationToGitHubPackagesRepository \
            :dd-sdk-android-internal:publishReleasePublicationToGitHubPackagesRepository \
            :features:dd-sdk-android-rum:publishReleasePublicationToGitHubPackagesRepository \
            :features:dd-sdk-android-trace:publishReleasePublicationToGitHubPackagesRepository \
            :features:dd-sdk-android-trace-api:publishReleasePublicationToGitHubPackagesRepository \
            :features:dd-sdk-android-trace-internal:publishReleasePublicationToGitHubPackagesRepository \
            :integrations:dd-sdk-android-okhttp:publishReleasePublicationToGitHubPackagesRepository \
            -Pdd-skip-signing --no-daemon --stacktrace
